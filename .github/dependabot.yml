version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait for a release to survive in the wild before adopting it. A
    # compromised release is usually yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it. Security
    # advisories bypass cooldown, so real fixes still arrive immediately.
    #
    # Only default-days here: the semver-* variants are rejected for the
    # github-actions ecosystem.
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # See the note above: npm is the ecosystem where install-time compromise is
    # most common, so the same waiting period applies.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    ignore:
      # TypeScript 7 is the native port: it exports the compiler API from
      # ./unstable/* instead of the package root, so ts-jest (peers <7),
      # typescript-eslint (peers <6.1.0), and @rollup/plugin-typescript all
      # break on it. Drop this entry once those three support 7.x. Minor and
      # patch updates to 5.x still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
