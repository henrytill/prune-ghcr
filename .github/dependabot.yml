version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait for a release to survive in the wild before adopting it. A
    # compromised release is usually yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it. Security
    # advisories bypass cooldown, so real fixes still arrive immediately.
    #
    # Only default-days here: the semver-* variants are rejected for the
    # github-actions ecosystem.
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # See the note above. go-github cuts a major roughly monthly, and a major
    # is never grouped, so expect a steady trickle of individual pull requests
    # for it -- the import path carries the major, so each one touches source.
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      gomod-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Patch only for the builder. A Go minor bump has to move the go directive
      # in go.mod and this image together, and Dependabot sees only the
      # Dockerfile, so it cannot make that change correctly. Its tags are not
      # semver either -- 1.27rc1 parses as newer than 1.26.6 rather than as a
      # prerelease, so no version range excludes release candidates without
      # also excluding the stable release.
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      docker-minor:
        update-types:
          - minor
          - patch
