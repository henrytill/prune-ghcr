version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7 is the native port: it exports the compiler API from
      # ./unstable/* instead of the package root, so ts-jest (peers <7),
      # typescript-eslint (peers <6.1.0), and @rollup/plugin-typescript all
      # break on it. Drop this entry once those three support 7.x. Minor and
      # patch updates to 5.x still come through.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
