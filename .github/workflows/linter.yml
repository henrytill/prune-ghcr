# This workflow will lint the entire codebase using the
# `super-linter/super-linter` action.
#
# For more information, see the super-linter repository:
#     https://github.com/super-linter/super-linter
name: Lint Codebase

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint Codebase
        id: super-linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          CHECKOV_FILE_NAME: .checkov.yml
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .
          # Read by pylint on its own too, unlike the .python-lint name
          # super-linter would otherwise look for. See .pylintrc.
          PYTHON_PYLINT_CONFIG_FILE: .pylintrc
          VALIDATE_ALL_CODEBASE: true
          # Not leftovers from the TypeScript action, despite there being no
          # JavaScript here: biome also formats and lints JSON, and the JSON
          # this repository does have -- .vscode/settings.json and the
          # devcontainer -- does not match what biome would write. Turning
          # these on reformats editor configuration to satisfy a linter, which
          # is the wrong way round.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # Neither Go mode works on this layout. VALIDATE_GO lints individual
          # files, so it hands golangci-lint paths from several packages at
          # once ("named files must all be in one directory"); upstream's own
          # guidance is to turn it off for a module. VALIDATE_GO_MODULES then
          # runs at the module root, which holds no .go files of its own ("no
          # go files to analyze"). The Continuous Integration workflow runs
          # golangci-lint over ./... instead, at a pinned version, against the
          # same .golangci.yml.
          VALIDATE_GO: false
          VALIDATE_GO_MODULES: false
          VALIDATE_JSCPD: false
          VALIDATE_JSON: false
