name: Dry Run

# End-to-end smoke test against a real package. Manual, because it needs a PAT
# and a package name that only the repository owner can supply.
on:
  # checkov:skip=CKV_GHA_7: this workflow builds and publishes nothing, so the
  # inputs cannot influence a build output. They only name the package to
  # report on, and the run is a dry run.
  workflow_dispatch:
    inputs:
      owner:
        description: Owner of the package.
        required: true
      package:
        description: Container package name.
        required: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prune (dry run)
        id: prune
        uses: ./
        with:
          token: ${{ secrets.GHCR_PAT }}
          owner: ${{ inputs.owner }}
          package: ${{ inputs.package }}
          dry-run: 'true'

      # A dry run deletes nothing, so `deleted` and `failed` are always zero
      # here and printing them would say nothing. The count worth reporting is
      # the difference between what was considered and what would survive.
      #
      # The emptiness check is not defensive padding. `uses: ./` runs the image
      # action.yml pins, which is the last published one, so `total` is empty
      # until a release carries it - and an empty operand in $(( )) is zero, so
      # the subtraction would quietly report a negative count instead.
      - name: Print Output
        id: output
        env:
          TOTAL: ${{ steps.prune.outputs.total }}
          KEPT: ${{ steps.prune.outputs.kept }}
        run: |
          if [ -z "$TOTAL" ]; then
            echo "keeping $KEPT; the pinned image does not report a total"
            exit 0
          fi
          echo "considered $TOTAL, keeping $KEPT"
          echo "would delete $((TOTAL - KEPT))"
