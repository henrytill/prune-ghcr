# This workflow checks the statuses of cached dependencies used in this action
# with the help of the Licensed tool. If any licenses are invalid or missing,
# this workflow will fail. See: https://github.com/licensee/licensed
#
# A dispatch refreshes the cache and opens a pull request with the result. It
# does not push to the default branch: that is blocked by the repository's
# ruleset, and a workflow that can write to main would undo the point of the
# ruleset.

name: Licensed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensed:
    name: Check Licenses
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        id: checkout
        # Unlike every other checkout here, this one keeps its credentials: the
        # workflow pushes the refreshed cache to a branch of its own.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby

      - uses: licensee/setup-licensed@0d52e575b3258417672be0dff2f115d7db8771d8 # v1.3.2
        with:
          version: 4.x
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Licenses
        id: update-licenses
        run: licensed cache

      # A branch and a compare URL, rather than a pull request: "Allow GitHub
      # Actions to create and approve pull requests" is off, and should stay
      # off. A workflow that can open pull requests is a rung on an escalation
      # ladder, traded for one click a few times a year.
      #
      # Only .licenses/ is staged: a stray file in the workspace should never
      # ride along into a branch that claims to be a cache refresh.
      - name: Push a branch with the refreshed cache
        id: push-branch
        run: |
          # Staged rather than `git diff --quiet`, which does not see untracked
          # files: a cache generated into a directory that does not exist yet
          # would look like no change at all, and be silently discarded.
          git add --intent-to-add .licenses
          if git diff --quiet -- .licenses; then
            echo "License cache is already up to date; nothing to push."
            exit 0
          fi

          branch="licensed/update-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add .licenses
          # The ID-prefixed noreply address pins attribution to the Actions
          # bot's account; see publish-image.yml for why a made-up name is
          # worse than it looks.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Auto-update license files"
          git push --set-upstream origin "$branch"

          echo "Open a pull request for the refreshed cache:"
          echo "  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${branch}?expand=1"

      # Last, check the status of the cached licenses.
      - name: Check Licenses
        id: check-licenses
        run: licensed status
