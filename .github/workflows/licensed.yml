# This workflow checks the statuses of cached dependencies used in this action
# with the help of the Licensed tool. If any licenses are invalid or missing,
# this workflow will fail. See: https://github.com/licensee/licensed
#
# A dispatch refreshes the cache and opens a pull request with the result. It
# does not push to the default branch: that is blocked by the repository's
# ruleset, and a workflow that can write to main would undo the point of the
# ruleset.

name: Licensed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licensed:
    name: Check Licenses
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        id: checkout
        # Unlike every other checkout here, this one keeps its credentials: the
        # workflow pushes the refreshed cache to a branch of its own.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ruby

      - uses: licensee/setup-licensed@0d52e575b3258417672be0dff2f115d7db8771d8 # v1.3.2
        with:
          version: 4.x
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Licenses
        id: update-licenses
        run: licensed cache

      # Only .licenses/ is staged: a stray file in the workspace should never
      # ride along into a pull request that claims to be a cache refresh.
      - name: Open a pull request with the refreshed cache
        id: open-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Staged rather than `git diff --quiet`, which does not see untracked
          # files: a cache generated into a directory that does not exist yet
          # would look like no change at all, and be silently discarded.
          git add --intent-to-add .licenses
          if git diff --quiet -- .licenses; then
            echo "License cache is already up to date; nothing to open."
            exit 0
          fi

          branch="licensed/update-${GITHUB_RUN_ID}"
          git config --local user.email "licensed-ci@users.noreply.github.com"
          git config --local user.name "licensed-ci"
          git switch -c "$branch"
          git add .licenses
          git commit -m "Auto-update license files"
          git push --set-upstream origin "$branch"

          gh pr create \
            --title "Auto-update license files" \
            --body "Generated by the Licensed workflow (run \`${GITHUB_RUN_ID}\`).

          \`licensed status\` runs at the end of that same run, so the cache in
          this branch has already been checked against the dependency tree.

          Note: this pull request was created with \`GITHUB_TOKEN\`, and events
          from that token do not start workflow runs, so its checks will be
          empty. Close and reopen it to run them."

      # Last, check the status of the cached licenses.
      - name: Check Licenses
        id: check-licenses
        run: licensed status
