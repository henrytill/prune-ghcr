name: CodeQL

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '31 7 * * 3'

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    # A matrix over one language, in a Go-only repository, and it has to stay.
    # The matrix is what makes the reported check `Analyze (go)`; without it the
    # job reports as plain `Analyze`, and `Analyze (go)` is a required context in
    # the `main` ruleset. Dropping it does not fail the check - it means the
    # required check never reports at all, and every pull request waits forever
    # on a status that is not coming.
    strategy:
      fail-fast: false
      matrix:
        language:
          - go

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The extractor builds the module, so the toolchain has to satisfy the go
      # directive in go.mod rather than whatever the runner image ships.
      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: ${{ matrix.language }}

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
