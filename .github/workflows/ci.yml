name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Format
        id: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      # The single owner of Go static analysis: vet, staticcheck and errcheck
      # all arrive through golangci-lint's standard set, so none of them runs
      # separately. Pinned rather than @latest, so a release cannot turn CI red
      # without a commit. See linter.yml for why super-linter does not do this.
      - name: Lint
        id: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 \
            run ./...

      - name: Test
        id: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Reports the breakdown into the run summary and fails below the floor in
      # .testcoverage.yml. The old badge was a committed SVG regenerated by
      # hand, which is the pattern this port exists to remove; once this is on
      # main, the same action can publish a badge to a branch.
      - name: Coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  # An end-to-end run needs a PAT and a real package, neither of which a fork's
  # pull request has; see the dry-run workflow for that.
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token is deliberately empty: this only proves the bundled action
      # loads and reports a misconfiguration instead of crashing.
      - name: Test Local Action
        id: test-action
        continue-on-error: true
        uses: ./
        with:
          token: ''
          dry-run: 'true'

      - name: Check the action failed cleanly
        id: output
        env:
          OUTCOME: ${{ steps.test-action.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the action to fail on an empty token"
            exit 1
          fi
