name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The single owner of Go static analysis and formatting: vet, staticcheck
      # and errcheck all arrive through golangci-lint's standard set, and gofmt
      # through the formatters section of .golangci.yml, so none of them runs
      # separately. See linter.yml for why super-linter does not do this.
      #
      # The action installs a prebuilt binary. `go run ...@v2.12.2` compiled it
      # from source on every run, which cost around 67s of a 111s job and never
      # amortized: setup-go's cache is keyed on go.sum and only written on a key
      # miss, so a build the key does not cover is restored but never saved.
      #
      # Two pins, both required. The SHA pins the action, and `version` pins the
      # linter, so neither an action release nor a linter release can turn CI
      # red without a commit. Bump them independently.
      - name: Lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        id: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Reports the breakdown into the run summary and fails below the floor in
      # .testcoverage.yml. The old badge was a committed SVG regenerated by
      # hand, which is the pattern this port exists to remove; once this is on
      # main, the same action can publish a badge to a branch.
      - name: Coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  # Builds the image twice from the same source and fails if the two digests
  # differ. Publishing sets SOURCE_DATE_EPOCH and rewrite-timestamp so that
  # rebuilding a commit reproduces the digest action.yml pins; the failure mode
  # that guards against is a new source of nondeterminism landing unnoticed and
  # only surfacing at release time, which is what this job moves to pull
  # request time.
  #
  # Both builds run on one runner, so this catches what a build embeds -
  # timestamps, random ordering, an unpinned dependency resolved twice - and not
  # dependence on the runner image or the buildkit version. Those are pinned
  # elsewhere: the toolchain in the Dockerfile, buildkit by the setup-buildx pin.
  reproducible-image:
    name: Reproducible Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set Up Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # The same value publish-image.yml derives, for the same reason.
      - name: Resolve SOURCE_DATE_EPOCH
        id: epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >>"$GITHUB_ENV"

      # An OCI layout rather than a registry push: nothing here has anywhere to
      # push to, and the digest an image exporter computes does not depend on
      # where the bytes land. Every flag that affects the digest has to match
      # what publish-image.yml passes, or this job proves the wrong thing.
      - name: Build
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image-a,tar=false,rewrite-timestamp=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      # no-cache, or the second build replays the first one's layers from the
      # builder cache and compares a result against itself.
      - name: Rebuild
        id: rebuild
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image-b,tar=false,rewrite-timestamp=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          no-cache: true

      - name: Compare digests
        id: compare
        run: |
          a=$(jq -r '.manifests[0].digest' /tmp/image-a/index.json)
          b=$(jq -r '.manifests[0].digest' /tmp/image-b/index.json)

          echo "first build:  $a"
          echo "second build: $b"

          if [ "$a" != "$b" ]; then
            echo "::error::the image is not reproducible: $a != $b"
            exit 1
          fi

          echo "### Reproducible image" >>"$GITHUB_STEP_SUMMARY"
          echo "Built twice, both \`$a\`." >>"$GITHUB_STEP_SUMMARY"

  # An end-to-end run needs a PAT and a real package, neither of which a fork's
  # pull request has; see the dry-run workflow for that.
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token is deliberately empty: this only proves the bundled action
      # loads and reports a misconfiguration instead of crashing.
      - name: Test Local Action
        id: test-action
        continue-on-error: true
        uses: ./
        with:
          token: ''
          dry-run: 'true'

      - name: Check the action failed cleanly
        id: output
        env:
          OUTCOME: ${{ steps.test-action.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the action to fail on an empty token"
            exit 1
          fi
