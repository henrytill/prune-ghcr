name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The single owner of Go static analysis and formatting: vet, staticcheck
      # and errcheck all arrive through golangci-lint's standard set, and gofmt
      # through the formatters section of .golangci.yml, so none of them runs
      # separately. See linter.yml for why super-linter does not do this.
      #
      # The action installs a prebuilt binary. `go run ...@v2.12.2` compiled it
      # from source on every run, which cost around 67s of a 111s job and never
      # amortized: setup-go's cache is keyed on go.sum and only written on a key
      # miss, so a build the key does not cover is restored but never saved.
      #
      # Two pins, both required. The SHA pins the action, and `version` pins the
      # linter, so neither an action release nor a linter release can turn CI
      # red without a commit. Bump them independently.
      - name: Lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        id: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Reports the breakdown into the run summary and fails below the floor in
      # .testcoverage.yml. The old badge was a committed SVG regenerated by
      # hand, which is the pattern this port exists to remove; once this is on
      # main, the same action can publish a badge to a branch.
      - name: Coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  # Builds the image twice from the same source and fails if the two digests
  # differ, then a third time to check the two exporters agree. Publishing sets
  # SOURCE_DATE_EPOCH and rewrite-timestamp so that rebuilding a commit
  # reproduces the digest action.yml pins; the failure mode
  # that guards against is a new source of nondeterminism landing unnoticed and
  # only surfacing at release time, which is what this job moves to pull
  # request time.
  #
  # Both builds run on one runner with one builder, so this catches what a build
  # embeds - timestamps, random ordering, an unpinned dependency resolved twice
  # - and not dependence on a version both builds happen to share. Those inputs
  # have to be pinned rather than compared: the toolchain and the frontend in
  # the Dockerfile, buildx and buildkit on the Set Up Buildx step below. The
  # action SHA pins none of the latter two - it pins the action, which otherwise
  # installs the newest buildx and runs the mutable `buildx-stable-1` buildkit.
  #
  # A third build then pushes through the `type=image` exporter that publishing
  # uses, because the equivalence this job would otherwise assume - that the two
  # exporters produce identical bytes - is the one that decides whether an
  # outside reproduction of a published digest can ever match.
  reproducible-image:
    name: Reproducible Image
    runs-on: ubuntu-latest

    # Somewhere for that third build to push. A pull request has no credentials
    # for ghcr.io, and does not need any: the manifest bytes a push produces do
    # not depend on which registry receives them.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Three pins, and publish-image.yml has to carry the first two unchanged:
      # `version` pins the buildx CLI, `image` pins buildkit, and the action SHA
      # pins neither. `network=host` and the inline config are what let the
      # builder reach the registry service over plain HTTP, and neither one
      # affects the bytes a build produces.
      #
      # `cache-binary: false` because the point of pinning a version is to know
      # which binary runs. The cache this action writes is a per-repository one
      # a pull request can populate, so restoring from it would take the buildx
      # binary from something less trustworthy than the pin - and would do it in
      # the workflow that publishes. Downloading it each run costs seconds.
      - name: Set Up Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          cache-binary: false
          driver-opts: |
            image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      # Derived the way publish-image.yml derives it, and for the same reason,
      # but not the same value: on a pull request the checkout is GitHub's
      # synthetic merge commit, so this is that commit's date and the label
      # below is its SHA. What the three builds here have to agree on is each
      # other, and they do; the value a release will use is whatever the merged
      # commit carries.
      - name: Resolve SOURCE_DATE_EPOCH
        id: epoch
        run: |
          epoch=$(git log -1 --pretty=%ct)
          case "$epoch" in
            '' | *[!0-9]*)
              echo "::error::no commit date for SOURCE_DATE_EPOCH: '${epoch}'"
              exit 1
              ;;
          esac
          echo "SOURCE_DATE_EPOCH=${epoch}" >>"$GITHUB_ENV"

      # An OCI layout rather than a registry push, which keeps the pair of
      # builds being compared for determinism off the network entirely; the
      # digest an image exporter computes does not depend on where the bytes
      # land. Every flag that affects the digest has to match what
      # publish-image.yml passes, or this job proves the wrong thing.
      #
      # `oci-mediatypes=true` is already the default for `type=oci`, and is
      # written out anyway: it is not the default for the exporter publishing
      # uses, and the two agreeing is the point.
      - name: Build
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image-a,tar=false,rewrite-timestamp=true,oci-mediatypes=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      # no-cache, or the second build replays the first one's layers from the
      # builder cache and compares a result against itself.
      - name: Rebuild
        id: rebuild
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image-b,tar=false,rewrite-timestamp=true,oci-mediatypes=true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false
          no-cache: true

      # The exporter publishing uses, against a throwaway registry. Everything
      # else matches the two builds above, so a digest that differs here is a
      # difference between the exporters and nothing else - which would mean the
      # recipe in docs/releasing.md can never reproduce a published digest, no
      # matter how deterministic the build is. Cache reuse is fine: this
      # compares exporters, not determinism.
      - name: Rebuild through the pushing exporter
        id: parity
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,push=true,rewrite-timestamp=true,oci-mediatypes=true
          tags: localhost:5000/prune-ghcr:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: false

      - name: Compare digests
        id: compare
        env:
          PUSHED: ${{ steps.parity.outputs.digest }}
        run: |
          a=$(jq -r '.manifests[0].digest // ""' /tmp/image-a/index.json)
          b=$(jq -r '.manifests[0].digest // ""' /tmp/image-b/index.json)

          echo "first build:  $a"
          echo "second build: $b"
          echo "pushed build: $PUSHED"

          # Without this, an index that stops carrying a digest where these read
          # for one leaves all three empty, and a guard that compares nothing
          # against nothing passes.
          for d in "$a" "$b" "$PUSHED"; do
            case "$d" in
              sha256:[0-9a-f]*) ;;
              *)
                echo "::error::not a digest: '${d}'"
                exit 1
                ;;
            esac
          done

          if [ "$a" != "$b" ]; then
            echo "::error::the image is not reproducible: $a != $b"
            exit 1
          fi

          if [ "$a" != "$PUSHED" ]; then
            echo "::error::the exporters disagree: $a != $PUSHED"
            exit 1
          fi

          echo "### Reproducible image" >>"$GITHUB_STEP_SUMMARY"
          echo "Built three times, all \`$a\`." >>"$GITHUB_STEP_SUMMARY"

  # An end-to-end run needs a PAT and a real package, neither of which a fork's
  # pull request has; see the dry-run workflow for that.
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token is deliberately empty: this only proves the bundled action
      # loads and reports a misconfiguration instead of crashing.
      - name: Test Local Action
        id: test-action
        continue-on-error: true
        uses: ./
        with:
          token: ''
          dry-run: 'true'

      - name: Check the action failed cleanly
        id: output
        env:
          OUTCOME: ${{ steps.test-action.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the action to fail on an empty token"
            exit 1
          fi
