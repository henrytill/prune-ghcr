name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The single owner of Go static analysis and formatting: vet, staticcheck
      # and errcheck all arrive through golangci-lint's standard set, and gofmt
      # through the formatters section of .golangci.yml, so none of them runs
      # separately. See linter.yml for why super-linter does not do this.
      #
      # The action installs a prebuilt binary. `go run ...@v2.12.2` compiled it
      # from source on every run, which cost around 67s of a 111s job and never
      # amortized: setup-go's cache is keyed on go.sum and only written on a key
      # miss, so a build the key does not cover is restored but never saved.
      #
      # Two pins, both required. The SHA pins the action, and `version` pins the
      # linter, so neither an action release nor a linter release can turn CI
      # red without a commit. Bump them independently.
      - name: Lint
        id: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Test
        id: test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Here rather than in reproducible-image, where the pins are used. What
      # this checks is mostly repo-wide -- that no workflow has grown a second
      # copy of a pin, that the declaration is still a build input -- and none
      # of it depends on a builder. reproducible-image is the slowest job and
      # starts a registry service before its first step, and the pins it reads
      # are rejected by script/builder-pins there anyway if either is missing.
      #
      # This job is named for Go because that is all it ran when it was named;
      # it is the cheap job, which is what a static check wants.
      - name: Test the builder pins
        id: test-pins
        run: script/test-builder-pins

      # The bump the pins arrive by, which has no runner requirement either: it
      # fakes `gh` and `curl` on PATH rather than resolving anything, so it says
      # the same thing this week as next.
      - name: Test the builder pin bump
        id: test-bump-pins
        run: script/test-bump-builder-pins

      # Reports the breakdown into the run summary and fails below the floor in
      # .testcoverage.yml. The old badge was a committed SVG regenerated by
      # hand, which is the pattern this port exists to remove; once this is on
      # main, the same action can publish a badge to a branch.
      - name: Coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

  # Builds the image twice from the same source and fails if the two digests
  # differ, then a third time to check the two exporters agree. Publishing sets
  # SOURCE_DATE_EPOCH and rewrite-timestamp so that rebuilding a commit
  # reproduces the digest action.yml pins; the failure mode
  # that guards against is a new source of nondeterminism landing unnoticed and
  # only surfacing at release time, which is what this job moves to pull
  # request time.
  #
  # Both builds run on one runner with one builder, so this catches what a build
  # embeds - timestamps, random ordering, an unpinned dependency resolved twice
  # - and not dependence on a version both builds happen to share. Those inputs
  # have to be pinned rather than compared: the toolchain and the frontend in
  # the Dockerfile, buildx and buildkit in .github/builder-pins.env. The action
  # SHA pins none of the latter two - it pins the action, which otherwise
  # installs the newest buildx and runs the mutable `buildx-stable-1` buildkit.
  #
  # A third build then pushes through the `type=image` exporter that publishing
  # uses, because the equivalence this job would otherwise assume - that the two
  # exporters produce identical bytes - is the one that decides whether an
  # outside reproduction of a published digest can ever match.
  reproducible-image:
    name: Reproducible Image
    runs-on: ubuntu-latest

    # Somewhere for that third build to push. A pull request has no credentials
    # for ghcr.io, and does not need any: the manifest bytes a push produces do
    # not depend on which registry receives them.
    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `network=host` and the inline config are what let the builder reach the
      # registry service over plain HTTP. Neither affects the bytes a build
      # produces, which is why they are the caller's to pass and the rest is
      # not.
      - name: Set Up Buildx
        id: buildx
        uses: ./.github/actions/setup-builder
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      # Derived the way publish-image.yml derives it, and for the same reason,
      # but not the same value: on a pull request the checkout is GitHub's
      # synthetic merge commit, so this is that commit's date and the label
      # below is its SHA. What the three builds here have to agree on is each
      # other, and they do; the value a release will use is whatever the merged
      # commit carries.
      # Assigned first, not interpolated straight into the echo: a failing
      # command substitution inside `echo "..."` leaves echo's own status, so
      # that form would write an empty value and carry on, which is the failure
      # the script exists to prevent.
      - name: Resolve SOURCE_DATE_EPOCH
        id: epoch
        run: |
          epoch=$(script/source-date-epoch)
          echo "SOURCE_DATE_EPOCH=${epoch}" >>"$GITHUB_ENV"

      # An OCI layout rather than a registry push, which keeps the pair of
      # builds being compared for determinism off the network entirely; the
      # digest an image exporter computes does not depend on where the bytes
      # land. The flags that do affect it are in the build-image action, so
      # `output` is the only difference between this and what publishing runs.
      - name: Build
        id: build
        uses: ./.github/actions/build-image
        with:
          output: type=oci,dest=/tmp/image-a,tar=false
          revision: ${{ github.sha }}

      # no-cache, or the second build replays the first one's layers from the
      # builder cache and compares a result against itself.
      - name: Rebuild
        id: rebuild
        uses: ./.github/actions/build-image
        with:
          output: type=oci,dest=/tmp/image-b,tar=false
          revision: ${{ github.sha }}
          no-cache: 'true'

      # The exporter publishing uses, against a throwaway registry. Everything
      # else matches the two builds above, so a digest that differs here is a
      # difference between the exporters and nothing else - which would mean the
      # recipe in docs/releasing.md can never reproduce a published digest, no
      # matter how deterministic the build is. Cache reuse is fine: this
      # compares exporters, not determinism.
      - name: Rebuild through the pushing exporter
        id: parity
        uses: ./.github/actions/build-image
        with:
          output: type=image,push=true
          tags: localhost:5000/prune-ghcr:ci
          revision: ${{ github.sha }}

      # Two comparisons rather than one, because they mean different things and
      # the step that fails is what says which: the first two builds differing
      # is nondeterminism, and the pushed build differing is the two exporters
      # disagreeing. script/assert-digest reports the values, not the meaning.
      - name: Check the build is reproducible
        id: compare
        run: |
          a=$(script/layout-digest /tmp/image-a)
          b=$(script/layout-digest /tmp/image-b)

          # Before the comparison, so that a red run says which build produced
          # which digest. assert-digest reports the two values it was given and
          # cannot know that one of them is the no-cache rebuild.
          echo "first build:  ${a}"
          echo "second build: ${b}"

          # Assigned rather than interpolated into the echo, for the reason
          # given on the epoch step above.
          digest=$(script/assert-digest "$a" "$b")
          echo "digest=${digest}" >>"$GITHUB_OUTPUT"

      # Both digests arrive the same way, as step outputs named in `env`, rather
      # than one of them being in the job's environment for every later step to
      # inherit. script/verify-digest makes the same argument about `changed`.
      - name: Check the exporters agree
        id: parity-compare
        env:
          BUILT: ${{ steps.compare.outputs.digest }}
          PUSHED: ${{ steps.parity.outputs.digest }}
        run: |
          echo "oci export:   ${BUILT}"
          echo "pushed build: ${PUSHED}"

          script/assert-digest "$BUILT" "$PUSHED"

          echo "### Reproducible image" >>"$GITHUB_STEP_SUMMARY"
          echo "Built three times, all \`${BUILT}\`." >>"$GITHUB_STEP_SUMMARY"

  # An end-to-end run needs a PAT and a real package, neither of which a fork's
  # pull request has; see the dry-run workflow for that.
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `uses: ./` reads action.yml, which names an image by digest, so this runs
      # the published image and not this branch: "local" describes where the
      # action definition comes from. What it proves is the wiring - that
      # action.yml is a definition the runner can load and hand inputs to, which
      # is a way every consumer would break at once.
      #
      # It cannot prove more than that. The assertion below is on the step's
      # outcome, and a step that failed because the digest was deleted, made
      # private, or never published failed just the same.
      - name: Run the image action.yml pins
        id: pinned-image
        continue-on-error: true
        uses: ./
        with:
          token: ''
          dry-run: 'true'

      - name: Check the action definition is usable
        id: output
        env:
          OUTCOME: ${{ steps.pinned-image.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the pinned image to fail on an empty token"
            exit 1
          fi

      # The claim the step above cannot make: the pinned digest is pullable and
      # the image behind it behaves. This one reads the error message, so a
      # digest that has been deleted or made private fails here rather than
      # passing as a clean rejection.
      - name: Check the pinned image is pullable and rejects an empty token
        id: pinned-smoke
        run: script/smoke-test-image "$(script/pinned-image HEAD)"

      # This branch, which is what nothing above tests. One platform and
      # straight into the local docker: a throwaway to execute rather than an
      # artifact to compare, so none of the flags that make a digest reproducible
      # apply and it does not go through .github/actions/build-image.
      #
      # A fourth build of the same source in one pull request, deliberately.
      # reproducible-image already pushes one to its registry service, and this
      # assertion could be a step there for free - but then a red
      # reproducible-image would take this signal down with it, and both are
      # required checks. Independent jobs cost 35s and fail one at a time.
      - name: Build this branch's image
        id: build
        run: docker build -t prune-ghcr:ci .

      # The invariant is that an empty token is a misconfiguration and not an
      # opt-out, since the alternative is a green run that quietly stopped
      # pruning. Asserted against the code being merged rather than against
      # whatever was published last.
      - name: Check it rejects an empty token
        id: smoke
        run: script/smoke-test-image prune-ghcr:ci
