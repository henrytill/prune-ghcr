name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check Format
        id: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed for: $unformatted"
            exit 1
          fi

      # The single owner of Go static analysis: vet, staticcheck and errcheck
      # all arrive through golangci-lint's standard set, so none of them runs
      # separately. Pinned rather than @latest, so a release cannot turn CI red
      # without a commit. See linter.yml for why super-linter does not do this.
      - name: Lint
        id: golangci-lint
        run: |
          go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 \
            run ./...

      - name: Test
        id: test
        run: go test -race -coverprofile=coverage.out ./...

  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci --ignore-scripts

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  # An end-to-end run needs a PAT and a real package, neither of which a fork's
  # pull request has; see the dry-run workflow for that.
  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The token is deliberately empty: this only proves the bundled action
      # loads and reports a misconfiguration instead of crashing.
      - name: Test Local Action
        id: test-action
        continue-on-error: true
        uses: ./
        with:
          token: ''
          dry-run: 'true'

      - name: Check the action failed cleanly
        id: output
        env:
          OUTCOME: ${{ steps.test-action.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::expected the action to fail on an empty token"
            exit 1
          fi
