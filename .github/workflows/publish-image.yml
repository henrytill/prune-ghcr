name: Publish Image

# Builds and pushes the image the action runs, then opens a pull request
# repointing action.yml at the digest.
#
# Dispatch only, and deliberately so. A trigger on the release tag would build
# an image nobody uses: action.yml at that tag was written earlier and names an
# older digest, so the image published under the tag would not be the image the
# action runs. The digest has to exist before the commit that references it,
# which means publishing comes first and tagging comes last.
on:
  # checkov:skip=CKV_GHA_7: the input names the tag the image is published
  # under, not anything the build reads. The build entry point is the committed
  # Dockerfile and the source is this checkout, both of which the input cannot
  # reach.
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, e.g. v1.1.0 or a prerelease.
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        id: checkout
        # Credentials are kept: this workflow pushes the digest branch.
        # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # buildx and buildkit are pinned in .github/builder-pins.env and read
      # there, along with `cache-binary: false`, by
      # .github/actions/setup-builder. This is the builder every rebuild that
      # checks a published digest has to stand up too, which is why it is one
      # action and not a step written out here.
      - name: Set Up Buildx
        id: buildx
        uses: ./.github/actions/setup-builder

      - name: Log In
        id: login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build input has to be a function of the source, timestamps
      # included, or the image is not reproducible. The commit date is the one
      # clock a third party rebuilding this commit also has.
      #
      # An empty value is a hard failure rather than an empty assignment, which
      # buildx reads as unset: `rewrite-timestamp` would then rewrite nothing,
      # the published image would carry build times, and nothing would go red
      # until someone tried to verify the release. script/source-date-epoch is
      # where that check lives, and assigning before the echo is what keeps it
      # from being bypassed by the substitution's status being discarded.
      - name: Resolve SOURCE_DATE_EPOCH
        id: epoch
        run: |
          epoch=$(script/source-date-epoch)
          echo "SOURCE_DATE_EPOCH=${epoch}" >>"$GITHUB_ENV"

      # Go cross-compiles, so both platforms build natively on the runner and
      # no QEMU emulation is involved.
      #
      # An `output` rather than `push: true`: the same registry export, but one
      # the build-image action can attach `rewrite-timestamp` and
      # `oci-mediatypes` to. Both are why this image reproduces at all, and both
      # now live there rather than being restated at each build. See
      # docs/releasing.md.
      - name: Build and Push
        id: build
        uses: ./.github/actions/build-image
        with:
          output: type=image,push=true
          tags: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          # The revision is what makes the pin auditable: given a digest, the
          # commit it was built from can be read back out of the image. It is
          # also a build input, so a rebuild has to pass the same value.
          revision: ${{ github.sha }}

      # action.yml is not a build input, so a commit that changes only this line
      # produces the same image. That is what makes publishing before the commit
      # that references the digest sound rather than circular.
      #
      # A branch and a compare URL rather than a pull request, for the reason
      # given in licensed.yml: this repository does not let Actions open pull
      # requests, deliberately.
      - name: Push a branch with the new digest
        id: push-branch
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ inputs.tag }}
        run: |
          image="docker://ghcr.io/${GITHUB_REPOSITORY}@${DIGEST}"
          sed -i -E "s|^(  image: ).*|\1${image}|" action.yml

          if git diff --quiet -- action.yml; then
            echo "action.yml already references ${DIGEST}; nothing to push."
            exit 0
          fi

          branch="publish/${TAG}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add action.yml
          # The ID-prefixed noreply address pins attribution to the Actions
          # bot's account. A bare made-up <name>@users.noreply.github.com would
          # attribute these commits to whoever registers <name> as a username.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Point the action at the ${TAG} image"
          git push --set-upstream origin "$branch"

          echo "Open a pull request to repoint action.yml:"
          echo "  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${branch}?expand=1"
