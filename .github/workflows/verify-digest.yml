name: Verify Digest

# Checks that the digest action.yml pins reproduces from the source it is being
# merged into. The reasoning is in docs/releasing.md; the logic is in
# script/verify-digest and script/assert-digest, which run outside Actions too.
#
# Releasing has a required sequence - publish, merge the digest commit, tag -
# because action.yml has to name a digest that already exists. Nothing enforced
# it: script/release checks after the fact that the pinned digest carries the
# tag, which catches a stale digest only once the release is being cut.
#
# The check belongs on the merge rather than the tag. The main ruleset has
# required status checks, so a merge can be gated; the release tag ruleset has
# only `deletion`, so a tag cannot be gated - and since tag deletion is blocked,
# a tag that failed verification could not even be withdrawn.
#
# It runs on every pull request and passes immediately when the pinned digest is
# unchanged. It must not filter on `paths: action.yml`: a required check that is
# filtered out never reports at all, which blocks every other pull request
# forever rather than passing them.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify Pinned Digest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # REV is an arbitrary distance back, and both the build-input diff and
          # its commit date need it present.
          fetch-depth: 0

      # Read rather than restated. buildx and buildkit decide the bytes a build
      # produces, so a rebuild has to use what publishing used; a third hardcoded
      # copy of the pins is a copy that can be missed by a bump, and the rebuild
      # would then report the mismatch as if the build were nondeterministic.
      # script/verify-digest's build-input diff covers publish-image.yml, so its
      # pins at HEAD are the pins the image was built with.
      - name: Read the builder pins publishing uses
        id: pins
        run: script/builder-pins >>"$GITHUB_OUTPUT"

      # buildx before the plan, which reads the revision label off the image.
      - name: Set Up Buildx
        id: buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: ${{ steps.pins.outputs.BUILDX_VERSION }}
          cache-binary: false
          driver-opts: |
            image=${{ steps.pins.outputs.BUILDKIT_IMAGE }}

      # The script routes its own results: `changed` to GITHUB_OUTPUT, since it
      # gates the steps below, and the rebuild's inputs to GITHUB_ENV.
      - name: Plan the verification
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: script/verify-digest "$BASE"

      # Every flag has to match what publish-image.yml passed, or this rebuilds
      # something else. The exporter differs - an OCI layout rather than a push -
      # which the third build in ci.yml's reproducible-image job is what makes
      # safe.
      - name: Rebuild
        id: rebuild
        if: steps.plan.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=/tmp/image,tar=false,rewrite-timestamp=true,oci-mediatypes=true
          labels: org.opencontainers.image.revision=${{ env.REV }}
          provenance: false

      - name: Compare with the pinned digest
        id: compare
        if: steps.plan.outputs.changed == 'true'
        run: |
          # Assigned first: a command substitution used as an argument discards
          # its own exit status, which is the shape ci.yml and publish-image.yml
          # both avoid. assert-digest would reject the empty string that a failed
          # layout-digest leaves, so this one is safe either way - but a rule
          # with an exception in it is a rule nobody applies.
          built=$(script/layout-digest /tmp/image)
          script/assert-digest "$DIGEST" "$built"
          {
            echo "### Pinned digest verified"
            echo
            echo "\`${DIGEST}\` rebuilds from \`${REV}\`, whose build inputs are"
            echo "identical to this pull request."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Report that there was nothing to verify
        id: unchanged
        if: steps.plan.outputs.changed != 'true'
        run: |
          echo "The pinned digest is unchanged; nothing to verify." \
            >>"$GITHUB_STEP_SUMMARY"
