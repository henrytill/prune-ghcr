name: Prune untagged GHCR versions
description: >-
  Delete untagged container versions of a package, keeping any that a tagged
  multi-arch index still references.
author: Henry Till
branding:
  icon: trash-2
  color: red

inputs:
  token:
    description: >-
      PAT with delete:packages (classic) or read+write Packages (fine-grained).
      GITHUB_TOKEN cannot delete versions of a user-owned package.
    required: true
  owner:
    description: Owner of the package.
    required: false
    default: ${{ github.repository_owner }}
  package:
    description: Container package name.
    required: false
    default: ${{ github.event.repository.name }}
  min-age-hours:
    description: >-
      Skip versions younger than this. If the publishing workflow serializes its
      runs, a concurrent build cannot leave child manifests untagged while this
      runs, and 0 is safe. Raise it if anything else pushes to the package
      out-of-band.
    required: false
    default: '0'
  dry-run:
    description: Report what would be deleted without deleting it.
    required: false
    default: 'false'

outputs:
  deleted:
    description: Number of versions deleted.
  kept:
    description: Number of versions kept.
  failed:
    description: Number of versions that failed to delete.

runs:
  # Builds on the runner, which is the slow path. The publish workflow replaces
  # this with an immutable reference to a prebuilt image before the first tag:
  #   image: docker://ghcr.io/henrytill/prune-ghcr@sha256:...
  # Until then this keeps the action runnable from the branch, so the container
  # plumbing can be verified before an image exists.
  using: docker
  image: Dockerfile
