# See: https://golangci-lint.run/usage/configuration/
#
# This is the single source of truth for Go static analysis, read by the Lint
# step in ci.yml and by `golangci-lint run` locally. super-linter does not lint
# Go at all: VALIDATE_GO and VALIDATE_GO_MODULES are off, because neither mode
# can lint a multi-package module.
#
# The Go job in ci.yml deliberately does not run `go vet` or `staticcheck` as
# separate steps: the standard set below already includes both. Running them
# twice, at two versions, under two configurations, is how this branch first
# produced a green Go job alongside a red lint job.
#
# The three linters enabled on top of the standard set are the ones
# super-linter's bundled configuration enabled, back when it did lint Go. They
# are kept explicitly rather than dropped: taking ownership of the configuration
# should not quietly weaken what the repository was already enforcing.

version: '2'

linters:
  # errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - gocyclo
    - gosec
    - revive
  settings:
    gocyclo:
      # super-linter's bundled configuration uses 15, and Prune was over it.
      min-complexity: 15

# Formatting is checked by `golangci-lint run` and applied by `golangci-lint
# fmt`, which replaces the gofmt step ci.yml used to carry. In v2 formatters are
# their own section: gofmt is not selectable under `linters`.
formatters:
  enable:
    - gofmt

run:
  # The default is a minute, which a cold build of the dependency graph can
  # exceed on a loaded runner.
  timeout: 5m
